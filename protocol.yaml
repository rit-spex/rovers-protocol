    signals:
      position:
        type: INT_16
        default: 0

  read_shoulder:
    id: 31
    protocol: CAN
    signals:
      position:
        type: INT_16
        default: 0

  read_elbow:
    id: 32
    protocol: CAN
    signals:
      position:
        type: INT_16
        default: 0

  read_wrist_bend:
    id: 33
    protocol: CAN
    signals:
      position:
        type: INT_16
        default: 0

  read_wrist_twist:
    id: 34
    protocol: CAN
    signals:
      position:
        type: INT_16
        default: 0

  read_gripper:
    id: 35
    protocol: CAN
    signals:
      state:
        type: UINT_8
        default: 0
      position:
        type: INT_16
        default: 0

  enable_science:
    id: 40
    protocol: CAN
    signals:
      enabled:
        type: UINT_8
        default: 0

  move_auger:
    id: 41
    protocol: CAN
    signals:
      position:
        type: INT_32
        default: 0
      home:
        type: UINT_8
        default: 0

  enable_drill:
    id: 42
    protocol: CAN
    signals:
      enable:
        type: UINT_8
        default: 0

  move_slide:
    id: 43
    protocol: CAN
    signals:
      stage:
        type: UINT_8
        default: 0

  enable_pump:
    id: 44
    protocol: CAN
    signals:
      id:
        type: UINT_8
        default: 0
      enable:
        type: UINT_8
        default: 0

  move_spectrometer_slide:
    id: 48
    protocol: CAN
    signals:
      stage:
        type: UINT_8
        default: 0
      home:
        type: UINT_8
        default: 0

  move_florometer_slide:
    id: 49
    protocol: CAN
    signals:
      stage:
        type: UINT_8
        default: 0
      home:
        type: UINT_8
        default: 0

  enable_florometer_micro_pump:
    id: 50
    protocol: CAN
    signals:
      enable:
        type: UINT_8
        default: 0

  enable_primer:
    id: 51
    protocol: CAN
    signals:
      enabled:
        type: UINT_8
        default: 0

  enable_vibration:
    id: 52
    protocol: CAN
    signals:
      enabled:
        type: UINT_8
        default: 0

  read_auger:
    id: 60
    protocol: CAN
    signals:
      position:
        type: UINT_32
        default: 0
      limit_switch:
        type: UINT_8
        default: 0

  read_slide:
    id: 61
    protocol: CAN
    signals:
      stage:
        type: UINT_8
        default: 0
      position:
        type: INT_32
        default: 0
      limit_switch:
        type: UINT_8
        default: 0

  read_drill:
    id: 62
    protocol: CAN
    signals:
      enabled:
        type: UINT_8
        default: 0

  read_pumps:
    id: 63
