version: "1.0"

data_types:
  BOOLEAN:
    num_bits: 1
    id: 0x05
  UINT_2_BOOL:
    num_bits: 2
    id: 0x01
  UINT_8:
    num_bits: 8
    id: 0x02
  UINT_8_JOYSTICK:
    num_bits: 8
    id: 0x04
  UINT_16:
    num_bits: 16
    id: 0x03
  UINT_32:
    num_bits: 32
    id: 0x06
  INT_32:
    num_bits: 32
    id: 0x07
  INT_16:
    num_bits: 16
    id: 0x08
  FLOAT_32:
    num_bits: 32
    id: 0x09

messages:
  heartbeat:
    id: 0x01
    direction: to_rover
    signals:
      timestamp:
        type: UINT_16
        default: 0

  xbox:
    id: 0x02
    direction: to_rover
    signals:
      AXIS_LY:
        type: UINT_8_JOYSTICK
        default: 100
      AXIS_RY:
        type: UINT_8_JOYSTICK
        default: 100
      A:
        type: UINT_2_BOOL
        default: false
      B:
        type: UINT_2_BOOL
        default: false
      X:
        type: UINT_2_BOOL
        default: false
      Y:
        type: UINT_2_BOOL
        default: false
      LEFT_BUMPER:
        type: UINT_2_BOOL
        default: false
      RIGHT_BUMPER:
        type: UINT_2_BOOL
        default: false
      AXIS_LT:
        type: UINT_2_BOOL
        default: false
      AXIS_RT:
        type: UINT_2_BOOL
        default: false

  n64:
    id: 0x03
    direction: to_rover
    signals:
      A: { type: UINT_2_BOOL, default: false }
      B: { type: UINT_2_BOOL, default: false }
      L: { type: UINT_2_BOOL, default: false }
      R: { type: UINT_2_BOOL, default: false }
      C_UP: { type: UINT_2_BOOL, default: false }
      C_DOWN: { type: UINT_2_BOOL, default: false }
      C_LEFT: { type: UINT_2_BOOL, default: false }
      C_RIGHT: { type: UINT_2_BOOL, default: false }
      DP_UP: { type: UINT_2_BOOL, default: false }
      DP_DOWN: { type: UINT_2_BOOL, default: false }
      DP_LEFT: { type: UINT_2_BOOL, default: false }
      DP_RIGHT: { type: UINT_2_BOOL, default: false }
      Z: { type: UINT_2_BOOL, default: false }

  quit:
    id: 0x04
    direction: to_rover
    signals:
      QUIT:
        type: BOOLEAN
        default: true

  auto_state:
    id: 0x05
    direction: to_rover
    signals:
      auto_state:
        type: UINT_8
        default: 0

  spacemouse:
    id: 0x06
    direction: to_rover
    signals:
      x: { type: INT_16, default: 0 }
      y: { type: INT_16, default: 0 }
      z: { type: INT_16, default: 0 }
      rx: { type: INT_16, default: 0 }
      ry: { type: INT_16, default: 0 }
      rz: { type: INT_16, default: 0 }
      buttons: { type: UINT_16, default: 0 }

  keyboard:
    id: 0x07
    direction: to_rover
    signals:
      enable_science: { type: UINT_8, default: 0 }
      move_auger_up: { type: UINT_8, default: 0 }
      move_auger_down: { type: UINT_8, default: 0 }
      auger_home: { type: UINT_8, default: 0 }
      enable_drill: { type: UINT_8, default: 0 }
      slide_next: { type: UINT_8, default: 0 }
      pump_1: { type: UINT_8, default: 0 }
      pump_2: { type: UINT_8, default: 0 }
      pump_3: { type: UINT_8, default: 0 }
      pump_4: { type: UINT_8, default: 0 }
      spec_slide_next: { type: UINT_8, default: 0 }
      fluoro_slide_next: { type: UINT_8, default: 0 }
      fluoro_micro_pump: { type: UINT_8, default: 0 }
      enable_primer: { type: UINT_8, default: 0 }
      enable_vibration: { type: UINT_8, default: 0 }

  life_detection:
    id: 0xF0
    direction: from_rover
    signals:
      color_sensor:
        type: UINT_8
        default: 0
      limit_switch_1:
        type: UINT_2_BOOL
        default: false
      limit_switch_2:
        type: UINT_2_BOOL
        default: false
      auger_depth:
        type: UINT_8
        default: 0
      pump_output_level:
        type: UINT_8
        default: 0
      slide_position:
        type: UINT_8
        default: 0
      selected_tube:
        type: UINT_8
        default: 0
      spec_slide_position:
        type: UINT_8
        default: 0
      spec_color_sensor:
        type: UINT_8
        default: 0

  arm_encoders:
    id: 0xF1
    direction: from_rover
    signals:
      arm_base_position:
        type: INT_16
        default: 0
      shoulder_position:
        type: INT_16
        default: 0
      elbow_position:
        type: INT_16
        default: 0
      wrist_bend_position:
        type: INT_16
        default: 0
      wrist_twist_position:
        type: INT_16
        default: 0
      gripper_position:
        type: INT_16
        default: 0

  drive_imu:
    id: 0xF2
    direction: from_rover
    signals:
      drive_speed_left:
        type: UINT_8_JOYSTICK
        default: 0.0
      drive_speed_right:
        type: UINT_8_JOYSTICK
        default: 0.0
      yaw:
        type: UINT_16
        default: 0
      pitch:
        type: UINT_16
        default: 0
      roll:
        type: UINT_16
        default: 0

  rover_estop:
    id: 0xF3
    direction: from_rover
    signals:
      rover_estop:
        type: BOOLEAN
        default: false

  subsystem_enabled:
    id: 0xF4
    direction: from_rover
    signals:
      arm_enabled:
        type: BOOLEAN
        default: false
      auto_enabled:
        type: BOOLEAN
        default: false
      life_enabled:
        type: BOOLEAN
        default: false

  control_mode:
    id: 0xF5
    direction: from_rover
    signals:
      control_mode:
        type: UINT_8
        default: 0

can_messages:
  estop:
    id: 0
    protocol: CAN
    signals:
      e_stop:
        type: UINT_8
        default: 0

  ros_heartbeat:
    id: 1
    protocol: CAN
    signals:
      source:
        type: UINT_8
        default: 0
      timestamp:
        type: UINT_32
        default: 0
      enabled:
        type: UINT_8
        default: 0

  teensy_heartbeat:
    id: 2
    protocol: CAN
    signals:
      source:
        type: UINT_8
        default: 0
      timestamp:
        type: UINT_32
        default: 0
      enabled:
        type: UINT_8
        default: 0

  enable_chassis:
