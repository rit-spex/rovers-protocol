controllers:
  xbox:
    name: xbox
    num_axes: 6
    num_used_axes: 2
    num_trigger: 2
    num_buttons: 8
    button_index_offset: 6
    joystick:
      min_value: 0
      neutral_int: 100
      neutral_float: 0.0
      max_value: 200
      axis_lx: 0
      axis_ly: 1
      axis_rx: 3
      axis_ry: 2
    trigger:
      axis_lt: 4
      axis_rt: 5
    button:
      "on": 2
      "off": 1
      a: 0
      b: 1
      x: 2
      y: 3
      left_bumper: 4
      right_bumper: 5
      select: 6
      start: 7
      home: 8
      left_stick: 9
      right_stick: 10
    joypad:
      up: [0, 1]
      down: [0, -1]
      left: [-1, 0]
      right: [1, 0]

  n64:
    name: n64
    num_axes: 2
    num_used_axes: 0
    num_trigger: 0
    num_buttons: 14
    joystick:
      min_value: 0
      neutral_int: 100
      max_value: 200
      axis_x: 0
      axis_y: 1
    button:
      "on": 2
      "off": 1
      a: 1
      b: 2
      c_up: 9
      c_down: 0
      c_left: 3
      c_right: 8
      l: 4
      r: 5
      z: 6
      start: 12
      dp_up: 20
      dp_down: 21
      dp_left: 22
      dp_right: 23
    joypad:
      up: [0, 1]
      down: [0, -1]
      left: [-1, 0]
      right: [1, 0]

  spacemouse:
    name: 3Dconnexion SpaceMouse
    vendor_id: 0x046d
    product_id: 0xC625
    axes:
      x: "x"
      y: "y"
      z: "z"
      rx: "rx"
      ry: "ry"
      rz: "rz"
    buttons: "buttons"

communication:
  serial:
    default_port_linux: "/dev/ttyUSB0"
    default_port_windows: "COM9"
    baud_rate: 230400
    remote_xbee_address: "0013A200423A7DDD"
  udp:
    host: "127.0.0.1"
    basestation_port: 5000
    rover_port: 5005
    telemetry_port: 5002

timing:
  update_frequency_ms: 40
  heartbeat_interval_ms: 500
  deadband_threshold: 0.10

controller_modes:
  normal_multiplier: 1.0
  creep_multiplier: 0.2
  reverse_multiplier: -1.0

auto_states:
  min: 0
  max: 5
