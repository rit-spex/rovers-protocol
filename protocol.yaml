    signals:
      enable:
        type: UINT_8
        default: 0

  drive_power:
    id: 13
    protocol: CAN
    signals:
      left:
        type: FLOAT_32
        default: 0
      right:
        type: FLOAT_32
        default: 0

  enable_arm:
    id: 20
    protocol: CAN
    signals:
      enable:
        type: UINT_8
        default: 0

  move_base:
    id: 21
